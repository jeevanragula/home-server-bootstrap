networks:
  homeserver:
    driver: bridge

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich_server
    environment:
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}
      DB_HOSTNAME: database
      REDIS_HOSTNAME: redis
      REDIS_PORT: 6379
    volumes:
      - ${DATA_ROOT}/immich/library:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    networks:
      - homeserver
    restart: unless-stopped

  redis:
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    container_name: immich_redis
    networks:
      - homeserver
    restart: unless-stopped

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    environment:
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: ${IMMICH_DB_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DATA_ROOT}/immich/postgres:/var/lib/postgresql/data
    networks:
      - homeserver
    restart: unless-stopped
    shm_size: 128mb

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8123:8123"
    networks:
      - homeserver
    restart: unless-stopped

  adguardhome:
    image: adguard/adguardhome:v0.107.79
    container_name: adguardhome
    volumes:
      - ${DATA_ROOT}/adguard/work:/opt/adguardhome/work
      - ${DATA_ROOT}/adguard/conf:/opt/adguardhome/conf
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    networks:
      - homeserver
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/dozzle:/data
    ports:
      - "8080:8080"
    networks:
      - homeserver
    restart: unless-stopped
